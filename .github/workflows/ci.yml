name: CI

# The per-PR safety net. Two jobs, minutes each, no data regeneration, no
# cron — this repo is private and runner minutes are billed, so CI runs on
# pull requests only and never on pushes to a working branch (rule 13
# [R-ACTIONS]: workflows are durable infrastructure only).
#
#   web  svelte-check (types) → vitest (unit, boundary rule, palette
#        validation, URL-base test) → vite build → "dist/ untouched" gate
#   py   pytest over tests/py (manifest builder, launcher, convert script)
#
# The dist/ gate is rule 11 [R-DIST]: dist/ is committed but written on main
# only by build-dist.yml. A PR that carries a dist/ change would race that
# job and produce merge conflicts on a minified bundle, so the diff of the PR
# against its base must not touch dist/.

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: check · test · build · dist untouched
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci
      - name: svelte-check + tsc
        run: npm run check
      - name: vitest
        run: npm test
      - name: vite build
        run: npm run build
      - name: dist/ untouched by this PR (R-DIST)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # HEAD is the PR merge commit (base tip + this PR), so a two-commit
          # tree diff against the base tip is exactly what this PR changes.
          # The base tip is fetched at depth 1: a tree diff needs no history.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD -- dist/ | grep .; then
            echo "PRs must not modify dist/ (R-DIST): dist/ is rebuilt on main by build-dist.yml"
            exit 1
          fi

  py:
    name: pytest tests/py
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # scripts/ and tools/ are stdlib-only; pytest is the single test dep.
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: pytest
        run: python -m pytest tests/py -q
